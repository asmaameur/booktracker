<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BookTracker — a private digital library. Browse the catalogue, keep your reading list and read in the browser." />
    <meta name="theme-color" content="#183D32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BookTracker</title>
    <script>
      // Applies the saved theme before the page paints, so it never flashes.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('booktracker.theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
